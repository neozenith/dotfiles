# screenz profile "home"          -- emitted by: screenz profile init home
# Apply with:   screenz apply home
# Preview with: screenz apply --dry-run home
version: 1
name: home-code

# Display aliases use the same terms as --display.
# An alias that does not resolve on this machine fails loudly (exit 1)
# before any window moves.
displays:
  samsung-left:
    name: "LU28R55 (1)"
    index: 2
  samsung-right:
    name: "LU28R55 (2)"
    index: 3
  laptop:
    built-in: true

# Rules run in order; a window is placed by the FIRST rule it matches.
rules:
  - match:
      bundle: com.microsoft.VSCode
    display: 2
    region: maximize
  - match:
      app: Google Chrome
    display: 3
    region: maximize
  - match:
      bundle: com.microsoft.edgemac
    display: 3
    region: maximize
    
