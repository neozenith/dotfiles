# screenz profile "od"          -- emitted by: screenz profile init od
# Apply with:   screenz apply od
# Preview with: screenz apply --dry-run od
version: 1
name: od

# Rules run in order; a window is placed by the FIRST rule it matches.
rules:
  - match:
      bundle: com.microsoft.VSCode
    display: dell-left # alias, or an inline map such as {index: 1}
    region: maximize
  - match:
      app: Google Chrome
      title: /Work/ # regex; add i after the closing slash for case-insensitive
    display: dell-right
    region: left-half
    gap: 8 # points between window and region edge
  - match:
      bundle: com.microsoft.edgemac
    display: dell-right
    region: right-half
    tolerance: 5% # accept frames within 5% of the target size; default 0.5 (points)
    each: true # default; false == --first
    order: title # title | pid | existing
rules:
  - match:
      app: /Code/
    display:
      index: 2
    region: left-half
  - match:
      app: /Edge/
    display:
      index: 2
    region: right-half
  - match:
      app: /Chrome/
    display:
      index: 2
    region: right-half