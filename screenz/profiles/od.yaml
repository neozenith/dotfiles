# screenz profile "od"          -- emitted by: screenz profile init od
# Apply with:   screenz apply od
# Preview with: screenz apply --dry-run od
version: 1
name: od

rules:
  - match:
      app: /Code/
    display:
      index: 2
    region: left-half
  - match:
      app: /Edge/
    display:
      index: 2
    region: right-half
  - match:
      app: /Chrome/
    display:
      index: 2
    region: right-half