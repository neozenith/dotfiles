# Managed by dotfiles → symlinked to ~/.config/kitty/kitty.conf
# Trialling kitty on the Rpi4 (GPU-accelerated, single-file config).

# --- Font -------------------------------------------------------------------
# Use the Mono variant so Nerd glyphs stay within one cell.
# Swap the comment to prefer Hack instead of FiraCode.
font_family      FiraCode Nerd Font Mono
# font_family    Hack Nerd Font Mono
bold_font        auto
italic_font      auto
bold_italic_font auto
font_size        12.0

# FiraCode ligatures render by default in kitty; disable only under the cursor
# so you can see the raw characters while editing.
disable_ligatures cursor

# --- Behaviour --------------------------------------------------------------
scrollback_lines      10000
enable_audio_bell     no
cursor_blink_interval 0
window_padding_width  4
confirm_os_window_close 0
